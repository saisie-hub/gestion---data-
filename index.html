<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Gestion-Data</title>
<style>
:root{--bg:#eef2f1;--card:#fff;--ink:#14232b;--mute:#5d6f76;--line:#d3dcdb;--acc:#0f6b4f;--err:#b3261e}
@media (prefers-color-scheme:dark){:root{--bg:#10191d;--card:#18252a;--ink:#e8f0ee;--mute:#9bb0b0;--line:#2b3c41;--acc:#3fbf93;--err:#ff8a80}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:640px;margin:0 auto;padding:16px}
h1{font-size:1.5rem;margin:8px 0 4px}h2{font-size:1.2rem;margin:0 0 8px}
.sub{color:var(--mute);margin:0 0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px}
label{display:block;font-size:.9rem;color:var(--mute);margin:10px 0 4px}
input,textarea{width:100%;padding:11px;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px}
textarea{min-height:160px}
:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
button{font:inherit;cursor:pointer;border-radius:8px;border:0;padding:12px 16px}
.main{background:var(--acc);color:#fff;width:100%;margin-top:16px;font-weight:600}
.link{background:none;color:var(--acc);padding:8px 0;text-decoration:underline}
.msg{margin-top:12px;min-height:1.2em;color:var(--mute)}.msg.err{color:var(--err)}
.hide{display:none}
.types{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.types button{background:var(--bg);color:var(--ink);border:1px solid var(--line)}
.types button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
#bar{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;background:var(--card);border-bottom:1px solid var(--line)}
#bar button{background:none;color:var(--ink);border:1px solid var(--line)}
#nav{display:none;background:var(--card);border-bottom:1px solid var(--line);padding:8px}
#nav.open{display:block}
#nav button{display:block;width:100%;text-align:left;background:none;color:var(--ink);padding:10px 12px}
#nav button.on{background:var(--bg);font-weight:600}
#nav button:disabled{color:var(--mute);cursor:default}
#nav small{color:var(--mute)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--bg);border-radius:8px;padding:12px;text-align:center}
.stat b{display:block;font-size:1.6rem}
.row{border-top:1px solid var(--line);padding:10px 0;display:flex;justify-content:space-between;gap:12px}
.row:first-child{border-top:0}.row small{display:block;color:var(--mute)}
.del{background:none;color:var(--err);padding:4px 8px}
@media(min-width:800px){
#bar button.burger{display:none}
#app:not(.hide){display:flex;min-height:100vh}
#side{width:260px;border-right:1px solid var(--line)}
#nav{display:block;border:0}
#content{flex:1}}
</style></head>
<body>

<section id="auth" class="wrap">
<h1>Gestion-Data</h1>
<p class="sub">Confiez vos données et documents à l'IA.</p>
<div class="card">
<label for="em">Adresse e-mail</label>
<input id="em" type="email" autocomplete="email">
<label for="pw">Mot de passe (8 caractères minimum)</label>
<input id="pw" type="password" autocomplete="current-password">
<button class="main" id="go">Se connecter</button>
<button class="link" id="sw" type="button">Pas de compte ? Créer un compte</button>
<div class="msg" id="am" role="status"></div>
</div>
</section>

<section id="onb" class="wrap hide">
<h1>Parlez-nous de vous</h1>
<p class="sub">Cela nous aide à adapter la plateforme.</p>
<div class="card">
<label>Vous travaillez...</label>
<div class="types" id="types"></div>
<label for="na">Nom de votre activité (facultatif)</label>
<input id="na">
<button class="main" id="ok">Continuer</button>
<div class="msg" id="om" role="status"></div>
</div>
</section>

<section id="app" class="hide">
<div id="side">
<div id="bar"><strong>Gestion-Data</strong><button class="burger" id="bg" type="button">Menu</button></div>
<nav id="nav"></nav>
</div>
<main id="content" class="wrap"></main>
</section>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const sb=supabase.createClient("https://fsedqwxplgrtvtvndoxw.supabase.co","sb_publishable_s7u3Ts6pdfn_M_X5tvZdqw_E9GO8XmM");
const $=id=>document.getElementById(id);
const S=[
["saisie","Saisie de données","Collez vos notes, listes ou textes : ils seront transformés en tableau propre.",1],
["nettoyage","Nettoyage de données","Collez votre tableau : doublons, formats et erreurs seront corrigés.",1],
["pdf","Conversion PDF","Collez le texte de votre PDF : il sera converti en tableau organisé.",1],
["mise_en_forme","Mise en forme de documents","Collez votre texte : il sera mis en forme (titres, sommaire, présentation).",1],
["recherche","Recherche web","",0],["fichiers","Organisation de fichiers","",0],["bases","Gestion de bases de données","",0]];
const TYPES=["Seul(e)","En équipe","Entreprise","Boutique"];
const ST={en_attente:"En attente",en_cours:"En cours",termine:"Terminée"};
let type="",view="dash",signup=false;

function el(tag,props,text){const e=document.createElement(tag);Object.assign(e,props||{});if(text!=null)e.textContent=text;return e}
function say(id,t,err){const m=$(id);m.textContent=t;m.className="msg"+(err?" err":"")}
function show(id){["auth","onb","app"].forEach(k=>$(k).classList.toggle("hide",k!==id))}

// Connexion
$("sw").onclick=()=>{signup=!signup;
$("go").textContent=signup?"Créer mon compte":"Se connecter";
$("sw").textContent=signup?"Déjà un compte ? Se connecter":"Pas de compte ? Créer un compte";say("am","")};
$("go").onclick=async()=>{
const email=$("em").value.trim(),password=$("pw").value;
if(!email||password.length<8)return say("am","Entrez votre e-mail et un mot de passe de 8 caractères minimum.",1);
say("am","Un instant…");
const r=signup?await sb.auth.signUp({email,password}):await sb.auth.signInWithPassword({email,password});
if(r.error)return say("am",r.error.message,1);
if(signup&&!r.data.session)return say("am","Compte créé. Confirmez votre e-mail, puis connectez-vous.");
say("am","");start()};

// Profil
const tb=$("types");
TYPES.forEach(t=>{const b=el("button",{type:"button"},t);
b.onclick=()=>{type=t;[...tb.children].forEach(c=>c.classList.toggle("on",c===b))};tb.append(b)});
$("ok").onclick=async()=>{
if(!type)return say("om","Choisissez une option.",1);
const {error}=await sb.from("profils").insert({type_compte:type,nom_activite:$("na").value.trim()||null});
if(error)return say("om",error.message,1);
start()};

async function start(){
const {data:{session}}=await sb.auth.getSession();
if(!session)return show("auth");
const {data:p}=await sb.from("profils").select("*").maybeSingle();
if(!p)return show("onb");
show("app");go("dash")}

// Menu
$("bg").onclick=()=>$("nav").classList.toggle("open");
function nav(){const n=$("nav");n.replaceChildren();
const add=(k,t,dis)=>{const b=el("button",{type:"button",className:k===view?"on":"",disabled:!!dis},t);
if(dis)b.append(el("br"),el("small",{},"Bientôt disponible"));
b.onclick=()=>{go(k);n.classList.remove("open")};n.append(b)};
add("dash","Tableau de bord");
S.forEach(s=>add(s[0],s[1],!s[3]));
const o=el("button",{type:"button"},"Se déconnecter");
o.onclick=async()=>{await sb.auth.signOut();show("auth")};n.append(o)}

function go(k){view=k;nav();const c=$("content");c.replaceChildren();
if(k==="dash")return dash(c);
svc(c,S.find(x=>x[0]===k))}

// Tableau de bord
async function dash(c){
c.append(el("h1",{},"Tableau de bord"),el("p",{className:"sub"},"Suivez vos demandes."));
const {data,error}=await sb.from("demandes").select("id,service,titre,statut,cree_le").order("cree_le",{ascending:false}).limit(200);
if(error)return c.append(el("p",{className:"msg err"},error.message));
const n=s=>data.filter(d=>d.statut===s).length;
const card=el("div",{className:"card"}),st=el("div",{className:"stats"});
[["Demandes",data.length],["En attente",n("en_attente")],["Terminées",n("termine")]].forEach(([l,v])=>{
const d=el("div",{className:"stat"});d.append(el("b",{},v),l);st.append(d)});
card.append(st);c.append(card);
const L=el("div",{className:"card"});L.append(el("h2",{},"Vos dernières demandes"));
if(!data.length)L.append(el("p",{className:"sub"},"Aucune demande pour l'instant. Choisissez un service dans le menu."));
data.slice(0,20).forEach(d=>{
const nom=(S.find(x=>x[0]===d.service)||[])[1]||d.service;
const r=el("div",{className:"row"}),i=el("div");
i.append(el("strong",{},nom),el("small",{},[d.titre,ST[d.statut]||d.statut,new Date(d.cree_le).toLocaleDateString("fr-FR")].filter(Boolean).join(" · ")));
const x=el("button",{className:"del",type:"button"},"Supprimer");
x.onclick=async()=>{if(!confirm("Supprimer cette demande ?"))return;await sb.from("demandes").delete().eq("id",d.id);go("dash")};
r.append(i,x);L.append(r)});
c.append(L)}

// Services
function svc(c,s){
c.append(el("h1",{},s[1]),el("p",{className:"sub"},s[2]));
const card=el("div",{className:"card"}),f=el("form");
f.append(el("label",{htmlFor:"t"},"Titre (facultatif)"),el("input",{id:"t"}),
el("label",{htmlFor:"ct"},"Vos données ou votre texte"),el("textarea",{id:"ct",required:true}),
el("button",{className:"main",type:"submit"},"Envoyer la demande"));
const m=el("div",{className:"msg",id:"sm",role:"status"});
f.onsubmit=async e=>{e.preventDefault();
const {error}=await sb.from("demandes").insert({service:s[0],titre:$("t").value.trim()||null,contenu:$("ct").value});
if(error)return say("sm",error.message,1);
f.reset();say("sm","Demande enregistrée. Le traitement automatique par l'IA arrive bientôt : en attendant, elle reste « En attente ».")};
card.append(f,m);c.append(card)}

start();
</script>
</body></html>
